const st=it=>{const e=it.awal+it.masuk-it.keluar-it.waste;return{m:it.masuk,k:it.keluar,w:it.waste,e,s:e<=0?'Habis':e<=it.min?'Menipis':'Aman'}};

function stockTable(){const qq=q.toLowerCase(),rows=S.items.map((i,n)=>({i,n})).filter(({i})=>qq?[i.cat,i.name,i.unit,st(i).s].join(' ').toLowerCase().includes(qq):(tab=='Semua'||i.cat==tab)),RR=rows.length>0&&rows.every(({i})=>i.cat=='Kommakohi Roastery'),BB=rows.length>0&&rows.every(({i})=>i.cat=='Bahan Kohi'),OP=rows.some(({i})=>i.cat=='Operasional'),RO=rows.some(({i})=>i.cat=='Kommakohi Roastery'),LI=(n,f,l)=>`<td><input class="ce" data-c="items" data-i="${n}" data-f="${f}"${l?` list="${l}"`:''} value="${esc(S.items[n][f]||'')}" style="width:115px"></td>`,E=(n,f,w,t)=>`<td>${EI('items',n,f,S.items[n][f],t?'n':'',w)}</td>`;

function stockCard(){
 return `<div class="c"><div class="tabs"><b style="margin-right:8px;font-size:15px">DAFTAR STOK</b>${['Semua',...CATS].map(c=>`<button data-a="tab" data-t="${esc(c)}" class="${tab==c?'on':''}">${esc(c)}</button>`).join('')}<input id="q" class="sr" placeholder="🔍 Cari di semua kategori (nama, kategori, satuan, status)..." value="${esc(q)}"><button class="btn" data-a="exp">Export</button><button class="btn" data-a="invt" data-t="stok">🧾 Invoice</button></div><div id="stk">${stockTable()}</div></div>`;
}
function donut(){
 const cnt=CATS.map(c=>S.items.filter(i=>i.cat==c).length),tot=sum(cnt,x=>x)||1;let off=0;
 const arcs=cnt.map((n,i)=>{const l=n/tot*100,a=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${COL[i%COL.length]}" stroke-width="7" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=l;return a}).join('');
 return `<div class="c"><h3>RINGKASAN STOK</h3><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="150" height="150"><circle r="15.9" cx="21" cy="21" fill="none" stroke="#2a2420" stroke-width="7"/>${arcs}<text x="21" y="20" text-anchor="middle" font-size="3.4" fill="#a89c8c">Total</text><text x="21" y="26" text-anchor="middle" font-size="6" font-weight="700" fill="#f1e9dc">${S.items.length}</text></svg><div style="flex:1;min-width:130px">${CATS.map((c,i)=>`<div class="row" data-a="cat" data-t="${esc(c)}" style="cursor:pointer"><span><span style="color:${COL[i%COL.length]}">●</span> ${esc(c)}</span><span>${cnt[i]} (${Math.round(cnt[i]/tot*100)}%)</span></div>`).join('')}</div></div></div>`;

function low(){
 const l=S.items.map(i=>({i,s:st(i)})).filter(x=>x.s.s!='Aman').sort((a,b)=>a.s.e/a.i.min-b.s.e/b.i.min);

function money(){

 const r=await fetch(SYNC.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)});const t=await r.text();
 if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(r.status+' '+m)}return t?JSON.parse(t):null}
const sbBusy=()=>{const a=document.activeElement;return !!$('#invo')||!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
function sbStatus(ok,e){SYNC.err=ok?'':String(e&&e.message||e||'').slice(0,160);CS=ok?'☁ Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'⚠ Sinkron gagal — data tetap aman di perangkat ini';
 const c=document.querySelector('.cs');if(c)c.textContent=CS;const s=$('#sy-st');if(s)s.textContent=CS+(SYNC.err?' · '+SYNC.err:'')}
async function sbSend(){S.ts=S.ts||Date.now();const d={};KS.forEach(k=>d[k]=S[k]);await SBF('kk_save',{p_code:SYNC.code,p_data:{v:1,ts:S.ts,upd:S.upd,d}});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sbApply(r){try{localStorage.setItem(KEY+'_bk',JSON.stringify(S))}catch(e){}KS.forEach(k=>{if(r.d[k]!==undefined)S[k]=r.d[k]});S.ts=r.ts;S.upd=r.upd||S.upd;mig();S.cats=S.cats||CATS.slice();CATS=S.cats;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function sbPull(first){if(!SYNC.on||SBB)return;if(!first&&sbBusy())return;SBB=1;
 try{const r=await SBF('kk_get',{p_code:SYNC.code}),lt=S.ts||0;
  if(r&&r.d&&r.ts){
   if(SYNC.ask&&HAD&&r.ts!=lt){SYNC.ask=false;
    if(confirm('Data online ditemukan untuk Kode Toko ini.\n\nOK = TIMPA data online dengan data di perangkat ini.\nBatal = pakai data online (data perangkat ini digantikan, cadangan lokal disimpan).')){S.ts=Date.now();await sbSend()}
    else{sbApply(r);render()}}
   else if(r.ts>lt){sbApply(r);render()}
   else if(lt>r.ts)await sbSend()}
  else await sbSend();
  SYNC.ask=false;SBR=true;sbStatus(1)}
 catch(e){sbStatus(0,e)}
 SBB=0}
function copyTxt(t,b){const done=()=>{if(b){const o=b.dataset.o||b.textContent;b.dataset.o=o;b.textContent='✓ Tersalin';setTimeout(()=>b.textContent=o,1500)}};
 try{navigator.clipboard.writeText(t).then(done,()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()})}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove();done()}}
function syncCard(){const on=SYNC.on;return `<div class="c"><h3>☁ Sinkron Online (Semua Perangkat)</h3>
<p class="mu">${on?'Aktif — data otomatis tersinkron di semua perangkat yang memakai Kode Toko yang sama.':'Belum aktif. Hubungkan ke database gratis (Supabase) agar data yang sama muncul di HP, laptop, dan tablet tanpa login.'}</p>
<div class="frm"><label>Project URL<input id="sy-url" style="width:250px" placeholder="https://xxxx.supabase.co" value="${esc(SYNC.url||'')}"></label><label>Anon / Publishable key<input id="sy-key" style="width:250px" value="${esc(SYNC.key||'')}"></label><label>Kode Toko (rahasia)<input id="sy-code" style="width:230px" placeholder="kosongkan = dibuat otomatis" value="${esc(SYNC.code||'')}"></label></div>
<p><button class="btn" data-a="syncsave">${on?'Simpan perubahan':'Simpan & Sambungkan'}</button> ${on?'<button class="btn" data-a="syncnow">↻ Sinkron sekarang</button> <button class="btn" data-a="syncshare">🔗 Salin Link Sinkron</button> <button class="btn" data-a="syncoff">Putuskan</button>':''}</p>
<p class="mu" id="sy-st">${on?esc(CS+(SYNC.err?' · '+SYNC.err:'')):''}</p>
<details><summary>📋 Cara setup (sekali saja, ±5 menit)</summary><ol class="mu"><li>Buka <b>supabase.com</b>, daftar gratis, lalu <b>New project</b>.</li><li>Menu <b>SQL Editor → New query</b>, tempel SQL di bawah, klik <b>Run</b>.</li><li>Menu <b>Project Settings → API</b>: salin <b>Project URL</b> dan key <b>anon / publishable</b>.</li><li>Tempel keduanya di kolom di atas, lalu <b>Simpan &amp; Sambungkan</b>.</li><li>Perangkat lain: tekan <b>🔗 Salin Link Sinkron</b>, kirim ke perangkat itu, lalu buka. Otomatis tersambung.</li></ol><p class="mu">⚠ Kode Toko bersifat rahasia. Siapa pun yang memegang link sinkron/kode dapat melihat dan mengubah data toko.</p><textarea readonly id="sy-sql" style="width:100%;height:150px">${esc(SQL_SETUP)}</textarea><p><button class="btn" data-a="syncsql">Salin SQL</button></p></details></div>`}
function syncAct(a,b){
 if(a=='syncsave'){let u=($('#sy-url').value||'').trim(),k=($('#sy-key').value||'').trim(),c=($('#sy-code').value||'').trim();
  try{u=new URL(u).origin}catch(e){$('#sy-st').textContent='⚠ Project URL tidak valid (contoh: https://xxxx.supabase.co)';return}
  if(!k){$('#sy-st').textContent='⚠ Isi key terlebih dulu';return}
  if(c.length<12){c='kk-'+Array.from((window.crypto||{getRandomValues:a=>a.map(()=>Math.random()*256)}).getRandomValues(new Uint8Array(14)),x=>x.toString(36).padStart(2,'0')).join('')}
  SYNC={url:u,key:k,code:c,on:true,ask:true};sbSave();SBR=false;SBB=0;CS='⏳ Menyambungkan…';render();sbPull(true).then(()=>{if(view=='set'&&!sbBusy())render()})}
 else if(a=='syncnow'){SBB=0;sbPull(true).then(()=>{if(view=='set'&&!sbBusy())render()})}
 else if(a=='syncoff'){try{localStorage.removeItem('kommakohi_sync')}catch(e){}SYNC={on:false};SBR=false;CS='💾 Tersimpan di perangkat ini';render()}
 else if(a=='syncshare'){copyTxt(location.href.split('#')[0]+'#sync='+btoa(unescape(encodeURIComponent(JSON.stringify({u:SYNC.url,k:SYNC.key,c:SYNC.code})))),b)}
 else if(a=='syncsql'){copyTxt(SQL_SETUP,b)}}
setInterval(()=>{if(SYNC.on&&!document.hidden)sbPull()},15000);addEventListener('online',()=>{if(SYNC.on)sbPull()});
setTimeout(()=>{if(SYNC.on)sbPull(true)},80);

function cloud(){if(SYNC.on){if(!SBR)return;clearTimeout(TM);TM=setTimeout(async()=>{try{await sbSend();sbStatus(1)}catch(e){sbStatus(0,e)}},700);return}if(!DB||!RDY)return;clearTimeout(TM);TM=setTimeout(async()=>{try{await Promise.all(KS.map(k=>DB.doc('kk/'+k).set({d:S[k]})));CS='☁ Tersimpan online'}catch(e){CS='⚠ Gagal simpan online (tersimpan di perangkat ini)'}const c=document.querySelector('.cs');if(c)c.textContent=CS},600)}
async function pull(first){try{const r=await Promise.all(KS.map(k=>DB.doc('kk/'+k).get()));if(r[0].exists){KS.forEach((k,i)=>{const d=r[i].data();if(d&&d.d!==undefined)S[k]=d.d});const ch=mig();if(S.cats)CATS=S.cats;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}RDY=true;CS='☁ Tersimpan online';render();if(ch)cloud()}else if(first){RDY=true;CS='☁ Tersimpan online';cloud();render()}}catch(e){CS='💾 Tersimpan di perangkat ini';render()}}
(async()=>{if(SYNC.on)return;try{DB=await claude.use('db')}catch(e){}if(DB)pull(true)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(SYNC.on)sbPull();else if(DB&&RDY)pull()}});
function recent(){const TL={masuk:'Masuk',keluar:'Keluar',pakai:'Pemakaian',waste:'Waste'},l=S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
 return `<div class="c"><h3>RIWAYAT BARANG MASUK & KELUAR TERBARU</h3><div class="w"><table><tr><th>Tanggal</th><th>Jenis</th><th>Barang</th><th class="r">Jumlah</th><th>Keterangan</th></tr>${l.map(x=>`<tr><td>${x.date}</td><td class="${x.type=='masuk'?'up':'dn'}">${TL[x.type]}</td><td>${esc(nm(x.item))}</td><td class="r">${nf(x.qty)}</td><td>${esc([x.jenis,x.note].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Belum ada catatan. Isi lewat menu Barang Masuk / Barang Keluar.</td></tr>'}</table></div></div>`}
function lapView(){const f=window.lf||day(29),t=window.lt||T,ty=window.lty||'Semua',TL={masuk:'Masuk',keluar:'Keluar',pakai:'Pemakaian',waste:'Waste'},rw=S.tx.filter(x=>x.date>=f&&x.date<=t&&(ty=='Semua'||TL[x.type]==ty)).sort((a,b)=>b.date.localeCompare(a.date)),it=id=>S.items.find(i=>i.id==id)||{};
 return `<div class="c"><h3>Laporan Barang Masuk & Keluar <button class="btn" data-a="invt" data-t="mutasi" style="float:right;padding:3px 10px">🧾 Buat Invoice</button></h3><div class="frm"><label>Dari<input type="date" data-l="lf" value="${f}"></label><label>Sampai<input type="date" data-l="lt" value="${t}"></label><label>Jenis<select data-l="lty">${['Semua','Masuk','Keluar','Pemakaian'].map(o=>`<option${o==ty?' selected':''}>${o}</option>`).join('')}</select></label></div><p class="mu">${rw.length} catatan</p></div><div class="c"><div class="w"><table><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Barang</th><th class="r">Jumlah</th><th>Keterangan</th></tr>${rw.map(x=>`<tr><td>${x.date}</td><td class="${x.type=='masuk'?'up':'dn'}">${TL[x.type]}</td><td>${esc(it(x.item).cat||'')}</td><td>${esc(nm(x.item))}</td><td class="r">${nf(x.qty)}</td><td>${esc([x.jenis,x.note].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Tidak ada catatan pada periode ini.</td></tr>'}</table></div></div>`}
function setView(){const c=S.cfg;return `${syncCard()}<div class="c"><h3>Pengaturan Toko</h3><div class="frm">${L('Nama toko',`<input data-c="name" value="${esc(c.name)}">`)}${L('Sub judul',`<input data-c="sub" value="${esc(c.sub)}">`)}${L('Kutipan header',`<input data-c="quote" value="${esc(c.quote)}" style="width:320px">`)}</div></div><div class="c"><h3>Kategori Barang</h3><div class="frm"><input id="nc" placeholder="Nama kategori baru"><button class="btn" data-a="addcat">Tambah</button></div><p>${CATS.map((c,i)=>`<span style="display:inline-block;margin:3px;padding:4px 10px;border:1px solid var(--ln);border-radius:14px">${esc(c)} <button class="x" data-a="delcat" data-i="${i}">✕</button></span>`).join('')}</p></div><div class="c"><h3>Cadangan Data</h3><p class="mu">Tekan <b>Buat Cadangan</b>, lalu salin teksnya dan simpan di Catatan/WhatsApp. Untuk memulihkan: tempel teks di kotak, tekan <b>Pulihkan</b>.</p><textarea id="bk" style="width:100%;height:110px"></textarea><p><button class="btn" data-a="bk">Buat Cadangan</button> <button class="btn" data-a="rs">Pulihkan</button></p></div>`}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id=='sd'){SD=t.value||T;render()}
  else if(d.f){const o=S[d.c][+d.i];o[d.f]=t.type=='number'?+t.value||0:t.value;save();setTimeout(()=>{const a=document.activeElement,k=a&&a.dataset&&a.dataset.f&&`[data-c="${a.dataset.c}"][data-i="${a.dataset.i}"][data-f="${a.dataset.f}"]`;if(k){render();const z=document.querySelector(k);z&&z.focus()}},0)}
 else if(d.c){S.cfg[d.c]=t.value;save();render()}
 else if(d.l){window[d.l]=t.value;render()}});
load();render();
</script></body></html>
